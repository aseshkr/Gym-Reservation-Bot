
<!DOCTYPE html>
<html>
<head>
    <title>Gym Booking Demo</title>
</head>
<body>
    <h1>Gym Reservation System</h1>

    <div id="login">
        <h2>Login</h2>
        <input name="username" placeholder="Username">
        <br><br>
        <input name="password" type="password" placeholder="Password">
        <br><br>
        <button type="submit" onclick="login()">Login</button>
    </div>

    <div id="booking" style="display:none;">
        <h2>Book Your Gym Slot</h2>

        <label>Select Date:</label>
        <input type="date" name="date">
        <br><br>

        <label>Select Time:</label>
        <select name="timeSlot">
            <option>09:00 AM</option>
            <option>11:00 AM</option>
            <option>02:00 PM</option>
            <option>05:00 PM</option>
        </select>
        <br><br>

        <button class="book" onclick="bookSlot()">Book Now</button>

        <p class="booking-confirmation"></p>
    </div>

    <script>
        function login() {
            document.getElementById("login").style.display = "none";
            document.getElementById("booking").style.display = "block";
        }

        function bookSlot() {
            document.querySelector(".booking-confirmation").innerText =
                "Booking confirmed successfully!";
        }
    </script>
</body>
</html>
